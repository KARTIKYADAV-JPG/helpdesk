[providers]
providers = ['php', 'node']

[phases.setup]
nixPkgs = [
    'php84',
    'php84Packages.composer',
    'php84Extensions.pdo_pgsql',
    'php84Extensions.pdo_mysql',
    'php84Extensions.imap',
    'php84Extensions.bcmath',
    'php84Extensions.gd',
    'php84Extensions.zip',
    'nodejs_20',
    'nginx'
]

[phases.build]
cmds = [
    'composer install --no-dev --optimize-autoloader',
    'npm ci && npm run build'
]

[start]
cmd = 'php artisan storage:link --force && php artisan config:cache && php artisan route:cache && php artisan view:cache && php artisan migrate --force && nixpacks-php-entrypoint'
